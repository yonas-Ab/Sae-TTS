name: Android CI Build (Sae TTS Benchmark)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Prepare .env from .env.example if absent
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Prepare debug.keystore for debugConfig signing
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-1.12.36.aar
          key: sherpa-onnx-aar-1.12.36

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download sherpa-onnx AAR if not cached
        run: ./gradlew :app:downloadSherpaOnnxAar --no-daemon

      - name: Run JVM & Robolectric unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sae-tts-benchmark-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  build-release:
    name: Build Signed Release APK (Tagged Releases)
    runs-on: ubuntu-latest
    needs: build-debug
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release signing secrets
        id: check_secrets
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          echo "has_keystore=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "Release signing secrets not configured; skipping release APK build."
          fi

      - name: Set up JDK 17
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure gradlew is executable
        if: steps.check_secrets.outputs.has_keystore == 'true'
        run: chmod +x ./gradlew

      - name: Prepare .env from .env.example if absent
        if: steps.check_secrets.outputs.has_keystore == 'true'
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Decode release keystore and prepare debug keystore
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          if [ ! -f debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Cache sherpa-onnx AAR
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-1.12.36.aar
          key: sherpa-onnx-aar-1.12.36

      - name: Setup Gradle
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Release APK artifact
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sae-tts-benchmark-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
